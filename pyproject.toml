[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "envdoctor"
version = "0.1.0"
description = "Diagnose .env files against .env.example: missing, extra, empty and leaked secrets"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "sndryu1" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/sndryu1/envdoctor"

[project.scripts]
envdoctor = "envdoctor:main"

[tool.setuptools]
py-modules = ["envdoctor"]
